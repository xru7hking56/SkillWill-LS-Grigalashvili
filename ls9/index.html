<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillMovie</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="title-header">
      <h1>The Sopranos</h1>
    </header>
    <main>
      <section class="main-section">
        <div class="poster-img-div">
          <figure>
            <img class="poster-img" src="mainimg.jpg" alt="The Sopranos" />
            <figcaption>The Sopranos, Poster</figcaption>
          </figure>
        </div>
        <div class="movie-des-div">
            <h2>Movie Description</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit totam, velit labore ad dolor dolorum nihil aut vel, nostrum itaque tempora quo doloremque quaerat natus deserunt maiores harum ratione quos!</p>
        </div>
        <div class="iframe-div">
            <h2>Movie Trailer</h2>
            <iframe class="iframe-soprano" width="600" height="400" src="https://www.youtube.com/embed/mJpNmYeooQE" title="The Sopranos Opening Credits Theme Song | The Sopranos | HBO" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
